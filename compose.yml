# Single sign-on for bulbashenko.com on Ory: Kratos (people, login, recovery), Hydra (OpenID Connect provider),
# Keto (groups), Oathkeeper (Traefik forward-auth) and a Next.js UI with the site's look.
#
# Built for a Coolify "Docker Compose" application deployed from this repository. Coolify side:
#   - General > Build pipeline > "Preserve repository during deployment" ON (configs are bind-mounted as directories).
#   - Advanced > "Connect to predefined network" OFF. The stack keeps its own network, so the unauthenticated admin
#     APIs of Kratos, Hydra and Keto are reachable only from inside it. Only `dbproxy` joins `coolify` (Postgres).
#   - Domains: sso-ui -> https://auth.bulbashenko.com. Kratos and Hydra take their paths on the same host through the
#     Traefik labels below (longer rules win). users.int and forward-auth go through hand-made Traefik files (README).
# Secrets named SERVICE_PASSWORD_* are generated by Coolify on first load.
# Everything marked ${VAR:?} must be filled in before the first deploy. See README.md.

x-ory-env: &ory-env
  # No anonymous usage statistics to Ory.
  SQA_OPT_OUT: "true"
  LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}

services:
  # TCP proxy to the shared Postgres; the only service on the `coolify` network.
  dbproxy:
    image: nginx:1.31.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./dbproxy:/etc/nginx/templates:ro
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 10s
      timeout: 3s
      retries: 5

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    restart: "no"
    exclude_from_hc: true
    depends_on:
      dbproxy:
        condition: service_healthy
    environment:
      <<: *ory-env
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:?}@dbproxy:5432/kratos?sslmode=disable&max_conns=10
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
    command: ["migrate", "sql", "-e", "--yes", "-c", "/etc/config/kratos/kratos.yml"]

  kratos:
    image: oryd/kratos:v26.2.0
    restart: unless-stopped
    expose:
      - "4433" # public, routed by the labels below
      - "4434" # admin, stack network only
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    extra_hosts:
      # SMTP to the mail server published on this host.
      - "host.docker.internal:host-gateway"
    environment:
      <<: *ory-env
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:?}@dbproxy:5432/kratos?sslmode=disable&max_conns=10
      SECRETS_COOKIE: ${SERVICE_PASSWORD_64_KRATOSCOOKIE}
      SECRETS_DEFAULT: ${SERVICE_PASSWORD_64_KRATOSDEFAULT}
      # Exactly 32 characters (openssl rand -hex 16). Encrypts credential data at rest.
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET:?}
      SECRETS_PAGINATION: ${SERVICE_PASSWORD_64_KRATOSPAGINATION}
      # smtps://<user>:<url-encoded password>@host.docker.internal:465/?server_name=mail.example.com
      COURIER_SMTP_CONNECTION_URI: ${SMTP_CONNECTION_URI:?}
      COURIER_SMTP_FROM_ADDRESS: ${SMTP_SENDER:?}
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml", "--watch-courier"]
    labels:
      # Kratos takes its paths on the UI's host. TLS uses the certificate Coolify obtains for the UI's domain.
      - traefik.enable=true
      - traefik.http.services.sso-kratos.loadbalancer.server.port=4433
      - traefik.http.routers.sso-kratos.rule=Host(`${AUTH_HOST:-auth.bulbashenko.com}`) && (PathPrefix(`/self-service/`) || PathPrefix(`/sessions/`) || PathPrefix(`/.well-known/ory/`))
      - traefik.http.routers.sso-kratos.priority=100
      - traefik.http.routers.sso-kratos.entrypoints=https
      - traefik.http.routers.sso-kratos.tls=true
      - traefik.http.routers.sso-kratos.service=sso-kratos
      - traefik.http.routers.sso-kratos.middlewares=sso-headers
      # Form submissions that take secrets are rate-limited: Kratos has no lockout of its own.
      - traefik.http.routers.sso-kratos-secrets.rule=Host(`${AUTH_HOST:-auth.bulbashenko.com}`) && Method(`POST`) && PathRegexp(`^/self-service/(login|recovery|verification|settings)`)
      - traefik.http.routers.sso-kratos-secrets.priority=200
      - traefik.http.routers.sso-kratos-secrets.entrypoints=https
      - traefik.http.routers.sso-kratos-secrets.tls=true
      - traefik.http.routers.sso-kratos-secrets.service=sso-kratos
      - traefik.http.routers.sso-kratos-secrets.middlewares=sso-limit-ip,sso-limit-all,sso-headers
      # Shared middlewares, also used by Hydra's routers.
      # Per client (Cloudflare's CF-Connecting-IP): 10 per minute, bursts of 5.
      - traefik.http.middlewares.sso-limit-ip.ratelimit.average=${AUTH_RATE_LIMIT_PER_CLIENT:-10}
      - traefik.http.middlewares.sso-limit-ip.ratelimit.period=1m
      - traefik.http.middlewares.sso-limit-ip.ratelimit.burst=5
      - traefik.http.middlewares.sso-limit-ip.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP
      # Everyone together: 120 per minute, so rotating addresses do not help either.
      - traefik.http.middlewares.sso-limit-all.ratelimit.average=${AUTH_RATE_LIMIT_TOTAL:-120}
      - traefik.http.middlewares.sso-limit-all.ratelimit.period=1m
      - traefik.http.middlewares.sso-limit-all.ratelimit.burst=20
      - traefik.http.middlewares.sso-limit-all.ratelimit.sourcecriterion.requesthost=true
      - traefik.http.middlewares.sso-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.sso-headers.headers.framedeny=true
      - traefik.http.middlewares.sso-headers.headers.referrerpolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.sso-headers.headers.stsseconds=31536000
      - traefik.http.middlewares.sso-headers.headers.stsincludesubdomains=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4434/admin/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    restart: "no"
    exclude_from_hc: true
    depends_on:
      dbproxy:
        condition: service_healthy
    environment:
      <<: *ory-env
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:?}@dbproxy:5432/hydra?sslmode=disable&max_conns=10
    volumes:
      - ./ory/hydra:/etc/config/hydra:ro
    command: ["migrate", "sql", "up", "-e", "--yes", "-c", "/etc/config/hydra/hydra.yml"]

  hydra:
    image: oryd/hydra:v26.2.0
    restart: unless-stopped
    expose:
      - "4444" # public, routed by the labels below
      - "4445" # admin, stack network only
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      <<: *ory-env
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:?}@dbproxy:5432/hydra?sslmode=disable&max_conns=10
      SECRETS_SYSTEM: ${SERVICE_PASSWORD_64_HYDRASYSTEM}
      SECRETS_COOKIE: ${SERVICE_PASSWORD_64_HYDRACOOKIE}
      SECRETS_PAGINATION: ${SERVICE_PASSWORD_64_HYDRAPAGINATION}
    volumes:
      - ./ory/hydra:/etc/config/hydra:ro
    command: ["serve", "all", "-c", "/etc/config/hydra/hydra.yml"]
    labels:
      - traefik.enable=true
      - traefik.http.services.sso-hydra.loadbalancer.server.port=4444
      - traefik.http.routers.sso-hydra.rule=Host(`${AUTH_HOST:-auth.bulbashenko.com}`) && (PathPrefix(`/oauth2/`) || Path(`/userinfo`) || Path(`/.well-known/openid-configuration`) || Path(`/.well-known/jwks.json`) || Path(`/.well-known/webfinger`))
      - traefik.http.routers.sso-hydra.priority=100
      - traefik.http.routers.sso-hydra.entrypoints=https
      - traefik.http.routers.sso-hydra.tls=true
      - traefik.http.routers.sso-hydra.service=sso-hydra
      - traefik.http.routers.sso-hydra.middlewares=sso-headers@docker
      - traefik.http.routers.sso-hydra-token.rule=Host(`${AUTH_HOST:-auth.bulbashenko.com}`) && Path(`/oauth2/token`)
      - traefik.http.routers.sso-hydra-token.priority=200
      - traefik.http.routers.sso-hydra-token.entrypoints=https
      - traefik.http.routers.sso-hydra-token.tls=true
      - traefik.http.routers.sso-hydra-token.service=sso-hydra
      - traefik.http.routers.sso-hydra-token.middlewares=sso-limit-ip@docker,sso-limit-all@docker,sso-headers@docker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4445/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  keto-migrate:
    image: oryd/keto:v26.2.0
    restart: "no"
    exclude_from_hc: true
    depends_on:
      dbproxy:
        condition: service_healthy
    environment:
      <<: *ory-env
      DSN: postgres://keto:${KETO_DB_PASSWORD:?}@dbproxy:5432/keto?sslmode=disable&max_conns=10
    volumes:
      - ./ory/keto:/etc/config/keto:ro
    command: ["migrate", "up", "--yes", "-c", "/etc/config/keto/keto.yml"]

  keto:
    image: oryd/keto:v26.2.0
    restart: unless-stopped
    expose:
      - "4466" # read, stack network only
      - "4467" # write, stack network only
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    environment:
      <<: *ory-env
      DSN: postgres://keto:${KETO_DB_PASSWORD:?}@dbproxy:5432/keto?sslmode=disable&max_conns=10
    volumes:
      - ./ory/keto:/etc/config/keto:ro
    command: ["serve", "-c", "/etc/config/keto/keto.yml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4466/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Traefik forward-auth for the mesh admin UIs: http://oathkeeper:4456/decisions.
  oathkeeper:
    image: oryd/oathkeeper:v26.2.0
    restart: unless-stopped
    expose:
      - "4456"
    depends_on:
      kratos:
        condition: service_healthy
      keto:
        condition: service_healthy
    environment:
      <<: *ory-env
    volumes:
      - ./ory/oathkeeper:/etc/config/oathkeeper:ro
    command: ["serve", "-c", "/etc/config/oathkeeper/oathkeeper.yml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4456/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Login, settings, consent and the admin page (users.int), with the site's look.
  sso-ui:
    build:
      context: ./ui
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
      keto:
        condition: service_healthy
    environment:
      PUBLIC_URL: ${AUTH_PUBLIC_URL:-https://auth.bulbashenko.com}
      ADMIN_HOST: ${AUTH_ADMIN_HOST:-users.int.bulbashenko.com}
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_ADMIN_URL: http://hydra:4445
      KETO_READ_URL: http://keto:4466
      KETO_WRITE_URL: http://keto:4467
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One-shot: creates or updates the OIDC clients from ory/hydra/clients/*.json, then exits.
  hydra-clients:
    build:
      context: ./ui
    restart: "no"
    exclude_from_hc: true
    depends_on:
      hydra:
        condition: service_healthy
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
      OIDC_SITE_CLIENT_SECRET: ${OIDC_SITE_CLIENT_SECRET:?}
      OIDC_HEADSCALE_CLIENT_SECRET: ${OIDC_HEADSCALE_CLIENT_SECRET:?}
      OIDC_FLUXWEB_CLIENT_SECRET: ${OIDC_FLUXWEB_CLIENT_SECRET:?}
      OIDC_GRAFANA_CLIENT_SECRET: ${OIDC_GRAFANA_CLIENT_SECRET:?}
    volumes:
      - ./ory/hydra/clients:/app/clients:ro
    # Plain-text secrets of the confidential clients; Hydra stores only their hashes.
    command: ["node", "scripts/sync-clients.mjs", "/app/clients"]

networks:
  coolify:
    external: true
