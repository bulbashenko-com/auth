# Builds the UI image (also used for the hydra-clients Job) and the e2e image (staging runs the suite against itself,
# deploy/staging/e2e.yaml) once `test` passed on a push to main, then asks bulbashenko-com/infra to pin the commit
# (staging at once, production with the release). Tag = full commit SHA: infra pins the same SHA for configs and images.
name: image

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ui:
    # Only commits that landed on main (not PRs from a branch named main) and passed UI checks + e2e.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/auth-ui:${{ steps.sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/auth-ui:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    needs: ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.ui.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: e2e
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/auth-e2e:${{ needs.ui.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/auth-e2e:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.ui.outputs.sha }}
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e

  # Pins the commit in bulbashenko-com/infra (dev): staging deploys it and runs e2e; production gets it with the release.
  promote:
    needs: [ui, e2e]
    if: github.ref == 'refs/heads/main'
    uses: bulbashenko-com/infra/.github/workflows/request-promote.yml@main
    with:
      app: auth
      sha: ${{ needs.ui.outputs.sha }}
    secrets: inherit
