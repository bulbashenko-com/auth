# Builds the UI image (also used for the hydra-clients Job) for the Kubernetes deployment, once `test`
# passed on a push to main, then asks bulbashenko-com/infra for the production deploy PR (the owner merges it).
# Tag = full commit SHA: bulbashenko-com/infra pins the same SHA for the configs and the image.
name: image

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ui:
    # Only commits that landed on main (not PRs from a branch named main) and passed UI checks + e2e.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/auth-ui:${{ steps.sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/auth-ui:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Opens or refreshes the production deploy PR deploy/auth in bulbashenko-com/infra.
  promote:
    needs: ui
    if: github.ref == 'refs/heads/main'
    uses: bulbashenko-com/infra/.github/workflows/request-promote.yml@main
    with:
      app: auth
      sha: ${{ needs.ui.outputs.sha }}
    secrets: inherit
