# Builds the UI image (also used for the hydra-clients Job) for the Kubernetes deployment.
# Tag = full commit SHA: bulbashenko-com/infra pins the same SHA for the configs and the image.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/auth-ui:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/auth-ui:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
