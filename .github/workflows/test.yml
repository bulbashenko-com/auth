# Every pull request (Renovate's version bumps included) runs the UI checks and the whole stack end to end.
# Merge only when both jobs are green. A push to main runs only the UI checks: it is the commit its PR already ran
# (the ruleset wants branches up to date), and staging runs the suite again against the deploy.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack
        run: e2e/run.sh up
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test
      - name: Service logs
        if: failure()
        run: e2e/run.sh logs --no-color > e2e/stack.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/stack.log
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: e2e/run.sh down
