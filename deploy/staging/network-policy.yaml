# Staging's extra routes (extras.yaml) on top of the base's allow-traefik: mailpit's web UI and the whoami stand-in.
# Mailpit's SMTP (1025) stays reachable from this namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-staging
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports:
        - { protocol: TCP, port: 8025 } # mailpit web UI
        - { protocol: TCP, port: 8080 } # whoami
