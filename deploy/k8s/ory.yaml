# Traefik forward-auth for admin UIs: GET http://oathkeeper.<ns>.svc:4456/decisions. No database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oathkeeper
spec:
  replicas: 1
  selector:
    matchLabels: { app: oathkeeper }
  template:
    metadata:
      labels: { app: oathkeeper }
    spec:
      securityContext:
        runAsNonRoot: true
        # Image users are named (ory/nonroot); the kubelet needs a numeric id to verify non-root.
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: oathkeeper
          image: oryd/oathkeeper:v26.2.0
          args: ["serve", "-c", "/etc/config/oathkeeper/oathkeeper.yml"]
          env:
            - { name: SQA_OPT_OUT, value: "true" }
            - { name: LOG_LEVEL, value: info }
          ports:
            - { name: api, containerPort: 4456 }
          readinessProbe:
            httpGet: { path: /health/ready, port: api }
          livenessProbe:
            httpGet: { path: /health/alive, port: api }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/config/oathkeeper }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: config
          configMap: { name: oathkeeper-config }
---
apiVersion: v1
kind: Service
metadata:
  name: oathkeeper
spec:
  selector: { app: oathkeeper }
  ports:
    - { name: api, port: 4456, targetPort: api }
