# Traefik routes. Public traffic reaches Traefik's `web` entrypoint through Cloudflare Tunnel; the admin page
# (users.int) is served on `websecure` from the mesh only, behind Oathkeeper. Hosts are the production ones;
# other environments patch them.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-public
spec:
  entryPoints: [web]
  routes:
    # Form submissions that carry secrets: rate-limited (Kratos has no lockout of its own).
    - match: Host(`auth.bulbashenko.com`) && Method(`POST`) && PathRegexp(`^/self-service/(login|recovery|verification|settings)`)
      priority: 200
      middlewares: [{ name: limit-ip }, { name: limit-all }, { name: headers }]
      services: [{ name: kratos, port: 4433 }]
    - match: Host(`auth.bulbashenko.com`) && Path(`/oauth2/token`)
      priority: 200
      middlewares: [{ name: limit-ip }, { name: limit-all }, { name: headers }]
      services: [{ name: hydra, port: 4444 }]
    - match: Host(`auth.bulbashenko.com`) && (PathPrefix(`/self-service/`) || PathPrefix(`/sessions/`) || PathPrefix(`/.well-known/ory/`))
      priority: 100
      middlewares: [{ name: headers }]
      services: [{ name: kratos, port: 4433 }]
    - match: Host(`auth.bulbashenko.com`) && (PathPrefix(`/oauth2/`) || Path(`/userinfo`) || Path(`/.well-known/openid-configuration`) || Path(`/.well-known/jwks.json`) || Path(`/.well-known/webfinger`))
      priority: 100
      middlewares: [{ name: headers }]
      services: [{ name: hydra, port: 4444 }]
    - match: Host(`auth.bulbashenko.com`)
      priority: 10
      middlewares: [{ name: headers }]
      services: [{ name: sso-ui, port: 3000 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-admin
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`users.int.bulbashenko.com`)
      middlewares:
        - { name: mesh-only, namespace: kube-system }
        - { name: forward-auth }
        - { name: headers }
      services: [{ name: sso-ui, port: 3000 }]
  tls: {}
---
# Per client (Cloudflare's CF-Connecting-IP): 10 per minute, bursts of 5.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limit-ip
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 5
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
# Everyone together: 120 per minute, so rotating addresses do not help either.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limit-all
spec:
  rateLimit:
    average: 120
    period: 1m
    burst: 20
    sourceCriterion:
      requestHost: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
# For every mesh admin UI: the address uses this namespace's Oathkeeper. Other namespaces reference it as
# <namespace>-forward-auth@kubernetescrd or by name+namespace in IngressRoutes.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
spec:
  forwardAuth:
    address: http://oathkeeper.auth.svc.cluster.local:4456/decisions
    trustForwardHeader: true
    authResponseHeaders: [Remote-User, Remote-Email, Remote-Name]
